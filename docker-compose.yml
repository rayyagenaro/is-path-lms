services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: is_path
      POSTGRES_USER: is_path
      POSTGRES_PASSWORD: is_path_secret
    ports:
      - "5432:5432"
    volumes:
      - is_path_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U is_path -d is_path"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  is_path_pgdata:
